name: visual-agent-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: visual_agent_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: visual_agent
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: agent_secure_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_admin -d visual_agent']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visual_agent_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: visual_agent_backend
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: 'postgresql+asyncpg://agent_admin:agent_secure_password@postgres:5432/visual_agent'
      REDIS_URL: 'redis://redis:6379'
      JWT_SECRET: 'super-secret-jwt-key-visual-agent'
      AI_WORKER_URL: 'http://ai-worker:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-worker
    container_name: visual_agent_ai_worker
    ports:
      - '8000:8000'
    environment:
      PORT: '8000'
      HOST: '0.0.0.0'
      REDIS_URL: 'redis://redis:6379'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-mock-key}'
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: visual_agent_dashboard
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
